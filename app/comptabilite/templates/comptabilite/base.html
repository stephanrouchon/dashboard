{% load compta %}<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Tableau de bord{% endblock %} – Comptabilité</title>
  <style>
    :root { --side: 240px; --bg: #f4f6f9; --dark: #1f2a3c; --accent: #3b82f6; }
    * { box-sizing: border-box; }
    body { margin: 0; font-family: system-ui, sans-serif; background: var(--bg); color: #222; }
    .sidebar { position: fixed; inset: 0 auto 0 0; width: var(--side); background: var(--dark); color: #cbd5e1; padding: 1rem 0; overflow-y: auto; }
    .sidebar h1 { font-size: 1.1rem; color: #fff; margin: 0 1.2rem 1.2rem; }
    .sidebar a { display: block; padding: .7rem 1.2rem; color: inherit; text-decoration: none; border-left: 4px solid transparent; }
    .sidebar a:hover { background: #2b3a52; color: #fff; }
    .sidebar a.active { background: #2b3a52; color: #fff; border-left-color: var(--accent); }
    main { margin-left: var(--side); padding: 1.5rem 2rem; }
    h2 { margin-top: 0; }
    .cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 1rem; margin-bottom: 1.5rem; }
    .card { background: #fff; padding: 1rem 1.2rem; border-radius: 8px; box-shadow: 0 1px 3px #0001; }
    .card small { color: #666; display: block; }
    .card strong { font-size: 1.4rem; }
    table { width: 100%; border-collapse: collapse; background: #fff; border-radius: 8px; overflow: hidden; box-shadow: 0 1px 3px #0001; margin-bottom: 1.5rem; }
    th, td { padding: .45rem .8rem; text-align: left; border-bottom: 1px solid #eee; font-size: .9rem; }
    th { background: #e9eef5; }
    .num { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
    .pos { color: #15803d; } .neg { color: #b91c1c; }
    form.filters { display: flex; gap: .5rem; margin-bottom: 1rem; flex-wrap: wrap; }
    input, select, button { padding: .4rem .6rem; border: 1px solid #ccd; border-radius: 4px; }
    button { background: var(--accent); color: #fff; border-color: var(--accent); cursor: pointer; }
    .bar { height: 10px; border-radius: 3px; margin: 2px 0; }
    .bar.p { background: #22c55e; } .bar.c { background: #ef4444; }
    .scroll { overflow-x: auto; }
    .scroll table { width: max-content; min-width: 100%; }
    tr.sub td { background: #f1f5f9; font-weight: 600; font-style: italic; }
    tr.total td, tr.total th { background: #e9eef5; font-weight: 600; }
    tr.result th, tr.result td { background: var(--dark); color: #fff; font-weight: 700; }
    .pager { margin: 1rem 0; }
  </style>
</head>
<body>
  <nav class="sidebar">
    <h1>📊 Comptabilité</h1>
    <a href="{% url 'comptabilite:dashboard' %}" class="{% if menu == 'dashboard' %}active{% endif %}">Tableau de bord</a>
    <a href="{% url 'comptabilite:balance' %}" class="{% if menu == 'balance' %}active{% endif %}">Balance</a>
    <a href="{% url 'comptabilite:compte_resultat' %}" class="{% if menu == 'compte_resultat' %}active{% endif %}">Compte de résultat</a>
    <a href="{% url 'comptabilite:soldes_intermediaires' %}" class="{% if menu == 'soldes_intermediaires' %}active{% endif %}">Soldes intermédiaires de gestion</a>
    <a href="{% url 'comptabilite:analytique' %}" class="{% if menu == 'analytique' %}active{% endif %}">Résultat analytique</a>
    <a href="{% url 'comptabilite:tresorerie' %}" class="{% if menu == 'tresorerie' %}active{% endif %}">Trésorerie</a>
    <a href="{% url 'comptabilite:journaux' %}" class="{% if menu == 'journaux' %}active{% endif %}">Journaux</a>
    <a href="{% url 'comptabilite:grand_livre' %}" class="{% if menu == 'grand_livre' %}active{% endif %}">Grand livre</a>
  </nav>
  <main>{% block content %}{% endblock %}</main>
</body>
</html>
